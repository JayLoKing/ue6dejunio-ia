[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ue6dejunio-ia"
version = "0.1.0"
description = "Modelo predictivo de riesgo academico - U.E. 6 de Junio"
requires-python = ">=3.11,<3.12"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# Depends/Header en el default del argumento es el idiom de FastAPI, no el bug
# que B008 persigue. `typer.Option` esta aqui por lo mismo: es como Typer declara
# una opcion de linea de comandos, y el objeto que devuelve no se muta.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Header", "fastapi.Query", "typer.Option",
]

# El formateador es `ruff format`, no black. Los dos estaban declarados con la
# misma line-length, pero black no estaba instalado en el entorno y nadie lo
# corria: el arbol no cumplia ninguno de los dos, que es la peor de las tres
# situaciones posibles. ruff format es compatible con black y ya estaba aca
# como linter, asi que queda uno solo y se corre.
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
